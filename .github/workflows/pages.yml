# Демо-версия сайта на GitHub Pages: публикует готовую папку build/ при каждом push в main.
# Форма заявки здесь не отправляется (Pages не выполняет PHP) — рабочая версия только на хостинге.
name: Deploy build/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['build/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
