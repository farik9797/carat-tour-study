{% import 'partials/macros.html' as m with context %}
{# Callback как в макете: фактура воды, эмблема слева, одна CTA-кнопка, самолёт со следом справа #}
<section class="relative overflow-hidden bg-navy-950 text-white">
  <img src="{{ asset('img/cta-water.webp') }}" alt="" width="1600" height="262" loading="lazy" decoding="async" class="absolute inset-0 h-full w-full object-cover" aria-hidden="true">
  <span class="absolute inset-0 bg-gradient-to-r from-navy-950/90 via-navy-900/55 to-navy-900/15" aria-hidden="true"></span>
  <svg class="absolute right-6 top-6 hidden h-24 w-72 text-white md:block lg:right-16" viewBox="0 0 288 96" fill="none" aria-hidden="true">
    <path d="M4 92C70 84 150 64 236 30" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 0"/>
    <path d="M14 94C84 88 160 70 240 38" stroke="currentColor" stroke-opacity=".2" stroke-width="1" stroke-linecap="round"/>
  </svg>
  <span class="material-symbols-rounded icon-fill absolute right-6 top-5 hidden !w-auto rotate-45 text-5xl text-white/80 md:block lg:right-16" aria-hidden="true">flight</span>
  <div class="container relative flex flex-col gap-6 py-12 md:flex-row md:items-center md:gap-10 md:py-14">
    <img src="{{ asset('img/cta-emblem.webp') }}" alt="" width="163" height="216" loading="lazy" decoding="async" class="hidden h-20 w-auto shrink-0 opacity-30 grayscale md:block lg:h-24" aria-hidden="true">
    <div class="max-w-2xl md:flex-1">
      <h2 class="text-2xl font-bold !text-white md:text-3xl text-balance">{{ S.home.final_title }}</h2>
      <p class="mt-2 text-white/80">{{ S.home.final_text }}</p>
    </div>
    <div class="md:pr-40 lg:pr-48">
      <a href="{{ cta_href }}" class="btn-accent !px-8 !py-3.5">{{ S.nav.cta }}{{ m.icon('arrow_forward', 'text-lg') }}</a>
    </div>
  </div>
</section>
